name: Application Build
run-name: Deploy by @${{ github.actor }}

on:
  workflow_dispatch:
  #push
  # branches:
  #- main
  #- develop
  #pull_request:
  # branch
  #- main
  #- develop
  
permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  Build:
    runs-on: ubuntu-latest
    name: Setup Nodejs & Application Build
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.1

    - name: Setup Node.js environment
      uses: actions/setup-node@v6.1.0
      with:
        node-version: 16.x

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v2
      env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
          args: >
            -Dsonar.projectKey=rajeevjadon_ReactTodoUIMonolith
            -Dsonar.organization=rajeevjadon


    - name: Super-Linter
      uses: super-linter/super-linter@v7.1.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUIB_TOKEN }}
        VALIDATE_CSS: true
        VALIDATE_JAVASCRIPTS_ES: true
        VALIDATE_JSON: true


    - name: Build Artifact
      run: npm run build


    - name: Publish Build Artifact
      uses: actions/upload-artifact@v6.0.0
      with: 
        name: reactTodoUI
        path: build
          

      
