name: Application Build
run-name: Deploy by @${{ github.actor }}

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  sonarjob:
    name: Scan job (sonarQube Analysis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1
        
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=rajeevjadon_ReactTodoUIMonolith
            -Dsonar.organization=rajeevjadon
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  lintjob:
    name: Lint job (Super Linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Super-Linter
        uses: super-linter/super-linter@v7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main

          VALIDATE_CSS: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true

          DISABLE_ERRORS: true 

  # -------------------------
  # Build Job
  # -------------------------
  buildJob:
    name: Build job Package (Setup Nodejs & Build Artifact)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.1

      - name: Setup Node.js environments
        uses: actions/setup-node@v4
        with:
          node-version: 16.x
          

      - name: Install dependencies
        run: npm install

      - name: Build artifact
        run: CI=false npm run build
  

      - name: Publish build artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: reactTodoUI
          path: build/
