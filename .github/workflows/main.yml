name: Application Build
run-name: Deploy by @${{ github.actor }}

on:
  workflow_dispatch:
  #push
  # branches:
  #- main
  #- develop
  #pull_request:
  # branch
  #- main
  #- develop
  
permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  scanjob:
    runs-on: ubuntu-latest
    name: Scan job(sonarQube Analysis)
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.1

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v2
      env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
          args: >
            -Dsonar.projectKey=rajeevjadon_ReactTodoUIMonolith
            -Dsonar.organization=rajeevjado


  LintJobs:
    name: Linter Jobs(Super Linter)
    runs-on: ubuntu-latest
    steps:
    - name: Super-Linter
      uses: super-linter/super-linter@v7.1.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUIB_TOKEN }}
        VALIDATE_CSS: true
        VALIDATE_JAVASCRIPTS_ES: true
        VALIDATE_JSON: true



  Buildjob:
    name: Build Job Package(Setup Nodejs & Build Artifact)
    runs-on: ubuntu-latest
    steps:
    - name: Install Dependencies
      run: npm install

    - name: Build Artifact
      run: npm run build

    - name: Publish Build Artifact
      uses: actions/upload-artifact@v6.0.0
      with: 
        name: reactTodoUI
        path: build
          

      
